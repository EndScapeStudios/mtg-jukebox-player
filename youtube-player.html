<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>MTG Jukebox Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
    }
    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.25);
      z-index: 10;
      pointer-events: auto;
    }
    #startButton {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: 700;
      background: white;
      color: black;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #message {
      color: white;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="message">Loading...</div>
  <div id="player"></div>
  <div id="overlay"><button id="startButton">Click to Start Music</button></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v') || params.get('videoId') || '';
    const controls = params.get('controls') === '0' ? 0 : 1;
    let player = null;
    let ready = false;
    let pendingStart = false;

    function setMessage(text) {
      const m = document.getElementById('message');
      if (m) m.textContent = text;
    }

    function hideOverlay() {
      const overlay = document.getElementById('overlay');
      if (overlay) overlay.style.display = 'none';
    }

    function showOverlay() {
      const overlay = document.getElementById('overlay');
      if (overlay) overlay.style.display = 'flex';
    }

    function startMusic() {
      pendingStart = true;
      if (!player || !ready) {
        setMessage('Loading player...');
        return;
      }
      try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        hideOverlay();
        setMessage('');
      } catch (e) {
        setMessage('Click play on the video.');
        showOverlay();
      }
    }

    window.startMusic = startMusic;
    window.startMusicFromUnity = startMusic;

    document.getElementById('startButton').addEventListener('click', function(e) {
      e.preventDefault();
      startMusic();
    });

    if (!videoId) {
      setMessage('Missing video ID.');
      showOverlay();
    } else {
      setMessage('Loading YouTube...');
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('player', {
        videoId: videoId,
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 0,
          controls: controls,
          rel: 0,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: function() {
            ready = true;
            setMessage('');
            showOverlay();
            if (pendingStart) startMusic();
          },
          onStateChange: function(event) {
            if (event.data === YT.PlayerState.PLAYING) {
              hideOverlay();
              setMessage('');
            }
          },
          onError: function(event) {
            setMessage('YouTube error: ' + event.data);
            showOverlay();
          }
        }
      });
    };
  </script>
</body>
</html>
