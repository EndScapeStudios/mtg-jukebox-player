<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>MTG Jukebox Player</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
    #player { position:absolute; inset:0; width:100%; height:100%; }
    #start {
      position:absolute; left:0; right:0; bottom:0; height:48px;
      border:0; background:rgba(0,0,0,.78); color:white; font-size:16px; font-weight:700;
      cursor:pointer; z-index:10;
    }
    #message { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:white; background:#111; padding:12px; text-align:center; }
  </style>
</head>
<body>
  <div id="message">Loading...</div>
  <div id="player"></div>
  <button id="start" onclick="startMusic()">Start Music</button>

  <script>
    let player = null;
    let ready = false;

    function params() { return new URLSearchParams(window.location.search); }
    function videoId() { return params().get('v') || params().get('videoId') || ''; }
    function show(msg) { document.getElementById('message').textContent = msg; }

    const id = videoId();
    if (!id) {
      show('Missing video ID.');
    } else {
      show('Loading video...');
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: id,
        playerVars: {
          autoplay: 1,
          controls: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          origin: window.location.origin
        },
        events: {
          onReady: function () {
            ready = true;
            document.getElementById('message').style.display = 'none';
            try { player.unMute(); player.setVolume(100); player.playVideo(); } catch(e) {}
          },
          onError: function (e) {
            show('YouTube error: ' + (e && e.data ? e.data : 'unknown'));
          }
        }
      });
    };

    window.startMusic = function () {
      try {
        if (!player || !ready) return false;
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        document.getElementById('start').style.display = 'none';
        return true;
      } catch (e) {
        show('Start failed: ' + e.message);
        return false;
      }
    };

    window.startMusicFromUnity = window.startMusic;
  </script>
</body>
</html>
